# Regenerate with: pwsh -File tool/generate_customer_launcher.ps1
# The owner-selected orange V comes from the unchanged official logo.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "build/branding/esnaftavar-launcher.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "build/branding/esnaftavar-launcher-foreground.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "build/branding/esnaftavar-launcher-monochrome.png"
  min_sdk_android: 24
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
