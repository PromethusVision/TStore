plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Only a path is supplied through the environment. Passwords and the keystore
// stay outside the checkout, including ignored files inside the checkout.
apply from: rootProject.file("release-signing.gradle")
def releaseInputs = resolveExternalReleaseSigning(System.getenv("ESNAFTAVAR_SIGNING_PROPERTIES"))
def keystoreProperties = releaseInputs.properties
def releaseStoreFile = releaseInputs.storeFile
def releaseSigningReady = releaseInputs.ready

tasks.register("verifyReleaseSigning") {
    group = "verification"
    description = "Proves the existing external upload key without building an artifact."
    doLast {
        def proof = proveExternalReleaseSigning(releaseInputs)
        println("Release signing proof: PASS")
        println("Certificate SHA-256: ${proof.sha256}")
        println("Certificate valid until: ${proof.validUntil}")
        println("Identity: existing EsnaftaVar RSA upload key; private-key challenge verified")
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    // Android flavor and Dart entrypoint are independent Flutter CLI options.
    // Reject cross-environment release binaries before compilation/packaging.
    [production: "lib/main_production.dart", development: "lib/main_development.dart"].each { flavor, entrypoint ->
        def capitalizedFlavor = flavor.capitalize()
        // Flutter may add another variant's compile task as a dependency of a
        // bundle. Validate the requested artifact, not incidental graph nodes.
        def flavorReleaseRequested = gradle.startParameter.taskNames.any { taskName ->
            taskName.tokenize(":").last().contains("${capitalizedFlavor}Release")
        }
        if (flavorReleaseRequested) {
            def requestedTarget = new File((project.findProperty("target") ?: "lib/main.dart").toString())
            def targetFile = requestedTarget.isAbsolute()
                ? requestedTarget
                : new File(rootProject.projectDir.parentFile, requestedTarget.path)
            def expectedTargetFile = new File(rootProject.projectDir.parentFile, entrypoint)
            if (targetFile.canonicalFile != expectedTargetFile.canonicalFile) {
                throw new GradleException(
                    "Customer release target must match its Android flavor (${flavor}). " +
                    "Use the documented flavor and entrypoint together."
                )
            }
        }
    }

    def releasePackagingRequested = taskGraph.allTasks.any { task ->
        task.project == project &&
            task.name.toLowerCase().matches("(assemble|bundle|package).*release")
    }
    def explicitReleaseFlavor = gradle.startParameter.taskNames.any { taskName ->
        taskName.contains("ProductionRelease") || taskName.contains("DevelopmentRelease")
    }
    if (releasePackagingRequested && !explicitReleaseFlavor) {
        throw new GradleException("Customer release packaging requires an explicit Android flavor.")
    }
    if (releasePackagingRequested && !releaseSigningReady) {
        throw new GradleException(
            "Production release signing is not configured: ${releaseInputs.reason}. " +
            "Use ESNAFTAVAR_SIGNING_PROPERTIES and the external signing guide; " +
            "never put signing credentials in the checkout."
        )
    }
    if (releasePackagingRequested) {
        // Validate passwords, the private key and the pinned owner certificate
        // before any release package can run, including a misleading debug key.
        proveExternalReleaseSigning(releaseInputs)
    }
}

android {
    namespace = "com.esnaftavar.app"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.esnaftavar.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }
    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile = releaseStoreFile
                storePassword = keystoreProperties.getProperty("storePassword")
                keyAlias = keystoreProperties.getProperty("keyAlias")
                keyPassword = keystoreProperties.getProperty("keyPassword")
            }
        }
    }
    flavorDimensions "default"
    productFlavors {
        production {
            dimension "default"
            resValue "string", "app_name", "EsnaftaVar"
            manifestPlaceholders = [authCallbackScheme: "com.esnaftavar.app"]
        }
        development {
            dimension "default"
            applicationIdSuffix ".dev"
            resValue "string", "app_name", "EsnaftaVar Dev"
            manifestPlaceholders = [authCallbackScheme: "io.supabase.tstore"]
        }
    }

    buildTypes {
        release {
            // Never fall back to the debug key for a store artifact. Compile-only
            // release tasks remain available, while APK/AAB packaging fails above
            // until the release owner provides secure signing material.
            signingConfig = releaseSigningReady ? signingConfigs.release : null
        }
    }
}

flutter {
    source = "../.."
}
