plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def requiredReleaseSigningProperties = [
    "storeFile",
    "storePassword",
    "keyAlias",
    "keyPassword",
]
def missingReleaseSigningProperties = requiredReleaseSigningProperties.findAll { propertyName ->
    def value = keystoreProperties.getProperty(propertyName)?.trim()
    value == null || value.isEmpty() || value.startsWith("REPLACE_WITH_")
}
def releaseStoreFile = missingReleaseSigningProperties.contains("storeFile")
    ? null
    : rootProject.file(keystoreProperties.getProperty("storeFile"))
def releaseSigningReady = keystorePropertiesFile.exists() &&
    missingReleaseSigningProperties.isEmpty() &&
    releaseStoreFile.isFile()

gradle.taskGraph.whenReady { taskGraph ->
    def releasePackagingRequested = taskGraph.allTasks.any { task ->
        task.project == project &&
            task.name.toLowerCase().matches("(assemble|bundle|package).*release")
    }
    if (releasePackagingRequested && !releaseSigningReady) {
        def reason = !keystorePropertiesFile.exists()
            ? "android/key.properties is missing"
            : !missingReleaseSigningProperties.isEmpty()
                ? "required signing properties are missing or placeholders"
                : "the configured keystore file does not exist"
        throw new GradleException(
            "Production release signing is not configured: ${reason}. " +
            "Use android/key.properties.example and the secure release setup guide; " +
            "never commit signing credentials."
        )
    }
}

android {
    namespace = "com.esnaftavar.app"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.esnaftavar.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }
    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile = releaseStoreFile
                storePassword = keystoreProperties.getProperty("storePassword")
                keyAlias = keystoreProperties.getProperty("keyAlias")
                keyPassword = keystoreProperties.getProperty("keyPassword")
            }
        }
    }
    flavorDimensions "default"
    productFlavors {
        production {
            dimension "default"
            resValue "string", "app_name", "EsnaftaVar"
        }
        development {
            dimension "default"
            applicationIdSuffix ".dev"
            resValue "string", "app_name", "EsnaftaVar Dev"
        }
    }

    buildTypes {
        release {
            // Never fall back to the debug key for a store artifact. Compile-only
            // release tasks remain available, while APK/AAB packaging fails above
            // until the release owner provides secure signing material.
            signingConfig = releaseSigningReady ? signingConfigs.release : null
        }
    }
}

flutter {
    source = "../.."
}
